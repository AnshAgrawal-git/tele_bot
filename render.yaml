# Render Blueprint for the Play 246 Telegram bot + CRM (free plan + Supabase Postgres).
# All data lives in Supabase (DATABASE_URL), so nothing is lost on deploys, restarts or sleep.
services:
  - type: web
    name: play246-crm-v2
    runtime: python
    plan: free
    region: singapore        # same region as the Supabase project
    branch: feature/bot-messages-crm
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health # also keep it pinged by UptimeRobot every 5 min
    envVars:
      - key: BOT_TOKEN       # from @BotFather; set in the dashboard, never commit it
        sync: false
      - key: ADMIN_GROUP_ID  # -1004349789648
        sync: false
      - key: DATABASE_URL    # Supabase → Connect → Session pooler (port 5432)
        sync: false
      - key: CRM_PASSWORD    # login password for the web CRM; empty = anyone with the link can open it
        sync: false
      - key: CRM_URL         # this service's public URL, used by the bot's "Open CRM" button
        sync: false
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.7
      - key: RUN_BOT         # 1 = this service receives Telegram messages (only one copy may)
        value: "1"
